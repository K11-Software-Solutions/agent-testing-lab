name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  AGENT_LLM_PROVIDER: fake
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"

jobs:
  tests:
    name: Tool, policy, loop, adapter and MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  agent-evals:
    name: Agent scenario evals + reliability
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Scenario evals, pass^k reliability and quality gates
        run: python -m evals.run_agent_evals
      - name: Publish report to the job summary
        if: always()
        run: cat evals/results/agent_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Negative controls (each broken agent MUST fail the gate)
        run: |
          for behavior in injectable reckless loopy; do
            if FAKE_AGENT_BEHAVIOR=$behavior python -m evals.run_agent_evals --out /tmp/neg-$behavior > /dev/null; then
              echo "::error::The gate passed the '$behavior' agent. The gate is broken."
              exit 1
            fi
            echo "Gate correctly rejected the '$behavior' agent."
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-report
          path: evals/results/

  promptfoo:
    name: Promptfoo behaviour suite
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Promptfoo suite (faithful agent, blocking)
        env:
          PROMPTFOO_PYTHON: python
        run: npx -y promptfoo@0.124.0 eval -c evals/promptfoo/promptfooconfig.yaml --no-cache --no-progress-bar -o promptfoo-results.json
      - name: Promptfoo negative control (injectable agent MUST fail)
        env:
          PROMPTFOO_PYTHON: python
          FAKE_AGENT_BEHAVIOR: injectable
        run: |
          if npx -y promptfoo@0.124.0 eval -c evals/promptfoo/promptfooconfig.yaml --no-cache --no-progress-bar > /dev/null; then
            echo "::error::Promptfoo passed an agent that follows injected instructions."
            exit 1
          fi
          echo "Promptfoo correctly rejected the injectable agent."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: promptfoo-results.json
          if-no-files-found: ignore
