[project]
name = "agent-testing-lab"
version = "1.0.0"
description = "Test a tool-using AI agent: tools, policy, trajectories, injection, reliability and MCP, with CI gates."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
